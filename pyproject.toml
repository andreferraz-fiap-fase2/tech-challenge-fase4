[project]
name = "tech-challenge-fase4"
version = "0.1.0"
description = "Voz do Cliente: RAG local sobre avaliações reais da Olist — FIAP Fase 4"
authors = [{name = "André Mohallem Ferraz"}]
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy==2.3.3",
  "pandas==2.3.2",
  "pyarrow==21.0.0",
  "sentence-transformers==5.1.1",
  "transformers==4.57.1",
  "torch==2.9.0",
  "streamlit==1.50.0",
  "requests==2.32.5",
]

[dependency-groups]
dev = ["pytest==8.4.2", "ruff==0.13.1"]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = {index = "pytorch-cpu"}

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
